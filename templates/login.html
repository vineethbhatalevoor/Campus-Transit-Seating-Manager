<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Transit Gateway Login</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            width: 320px;
            text-align: center;
            color: white;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #2563eb;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>Campus Transit Login</h2>
        <form action="/login" method="POST">
            <select name="role">
                <option value="admin">Infrastructure Administrator</option>
                <option value="driver">Fleet Operations Specialist (Driver)</option>
                <option value="student">Commuter (Student)</option>
            </select>
            <input type="text" name="user_id" placeholder="Authentication Identity / USN" required>
            <input type="password" name="password" placeholder="Access Password" required>
            <button type="submit">Access Infrastructure</button>
        </form>
    </div>
</body>

</html>
